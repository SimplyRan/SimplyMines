name: SimplyMines
version: '1.2.1'
main: me.simplyran.simplymines.SimplyMines
api-version: '1.21'
soft-depend:
  - Nexo
  - ItemsAdder
  - PlaceholderAPI
  - CraftEngine

libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.46.1.3
  - com.mysql:mysql-connector-j:8.4.0

commands:
  sm:
    aliases:
      - simplymines
      - simplymine
    description: SimplyMines

permissions:
  sm.use.autopickup:
    description: Drops go straight into the inventory in mines with Auto Pickup enabled
    default: true
  sm.use.autosmelt:
    description: Drops are smelted in mines with Auto Smelt enabled
    default: true

