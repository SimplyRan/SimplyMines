plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id "io.github.goooler.shadow" version "8.1.8"
}

shadowJar {
    relocate("dev.triumphteam.gui", "simplyran.gui")
    archiveBaseName.set("SimplyMines")
    archiveClassifier.set("")
}


group = 'me.simplyran'
version = '1.2.3'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven{
        url = "https://repo.nexomc.com/releases"
    }
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }

    maven { url 'https://jitpack.io' }

    maven { url 'https://repo.momirealms.net/releases/' }
}

dependencies {
    // Build against the lowest supported version (1.21.4); newer servers stay compatible.
    compileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
    // Adventure is provided by Paper; bundling triumph's adventure-platform breaks on Adventure 5 (Paper 26.x).
    implementation("dev.triumphteam:triumph-gui:3.1.13") {
        exclude group: "net.kyori"
    }

    compileOnly 'me.clip:placeholderapi:2.12.3'

    //Textures Managers
    compileOnly("beer.devs:itemsadder-api:4.0.18-beta-10")
    compileOnly("com.nexomc:nexo:1.25.0")

    compileOnly 'net.momirealms:craft-engine-core:26.7.3'
    compileOnly 'net.momirealms:craft-engine-bukkit:26.7.3'


    compileOnly "com.github.MilkBowl:VaultAPI:1.7.1"

    compileOnly 'com.zaxxer:HikariCP:5.1.0'
    compileOnly 'org.xerial:sqlite-jdbc:3.46.1.3'
    compileOnly 'com.mysql:mysql-connector-j:8.4.0'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.4")
    }
}

// Test the other end of the supported range: ./gradlew runServer12111 / runServer26
tasks.register("runServer12111", xyz.jpenilla.runpaper.task.RunServer) {
    minecraftVersion("1.21.11")
    runDirectory.set(layout.projectDirectory.dir("run-1.21.11"))
    pluginJars.from(tasks.named("shadowJar").flatMap { it.archiveFile })
}

tasks.register("runServer26", xyz.jpenilla.runpaper.task.RunServer) {
    minecraftVersion("26.2")
    runDirectory.set(layout.projectDirectory.dir("run-26"))
    pluginJars.from(tasks.named("shadowJar").flatMap { it.archiveFile })
    javaLauncher.set(javaToolchains.launcherFor { languageVersion.set(JavaLanguageVersion.of(25)) })
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:removal']

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
